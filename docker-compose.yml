services:
  livekit-server:
    image: livekit/livekit-server
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7892:7882-7892/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    depends_on:
      - redis
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - DATABASE_URL=postgresql://postgres:postgres@pgvector:5435/rag
    depends_on:
      - livekit-server
      - pgvector
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./src/api_server.py
        - action: rebuild
          path: ./requirements.txt

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    entrypoint: ["bash", "entrypoint.sh"]
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - DATABASE_URL=postgresql://postgres:postgres@pgvector:5435/rag
      - QDRANT_URL=http://qdrant:6333
      - PG_HOST=pgvector
      - PG_PORT=5432
    depends_on:
      - livekit-server
      - pgvector
      - qdrant
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./src/agent.py
        - action: rebuild
          path: ./requirements.txt

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5435:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - pgvector
    restart: unless-stopped

  sip:
    image: livekit/sip
    network_mode: host
    depends_on:
      - livekit-server
      - redis
    environment:
      SIP_CONFIG_BODY: |
        api_key: APIuoFDt5njRYLA
        api_secret: MooeqeW9ae5QvvlgjFFGbuFkzA7160g9e5mSVPfAbEIH
        ws_url: ws://host.docker.internal:7880
        redis:
          address: host.docker.internal:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug
  
  qdrant:
    image: qdrant/qdrant:v1
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  pgvector_data:
  qdrant_data: